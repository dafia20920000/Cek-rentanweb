<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQL Injection Scanner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f5f5f5;
            font-family: 'Courier New', monospace;
        }
        .terminal {
            background-color: #1e1e1e;
            color: #f0f0f0;
            border-radius: 5px;
            padding: 15px;
            font-family: 'Courier New', monospace;
            height: 300px;
            overflow-y: auto;
        }
        .log-entry {
            margin-bottom: 5px;
            white-space: pre-wrap;
        }
        .success {
            color: #4CAF50;
        }
        .warning {
            color: #FFC107;
        }
        .error {
            color: #F44336;
        }
        .info {
            color: #2196F3;
        }
        #scanProgress {
            height: 25px;
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="text-center mb-4">
            <h1>SQL Injection Scanner</h1>
            <p class="text-muted">Open-source SQL injection vulnerability scanner</p>
        </div>

        <div class="card shadow mb-4">
            <div class="card-header bg-dark text-white">
                <h5 class="mb-0">Scan Configuration</h5>
            </div>
            <div class="card-body">
                <form id="scanForm">
                    <div class="row mb-3">
                        <div class="col-md-9">
                            <label for="targetUrl" class="form-label">Target URL</label>
                            <input type="url" class="form-control" id="targetUrl" placeholder="https://example.com/page.php?id=1" required>
                        </div>
                        <div class="col-md-3">
                            <label for="httpMethod" class="form-label">HTTP Method</label>
                            <select class="form-select" id="httpMethod">
                                <option value="GET">GET</option>
                                <option value="POST">POST</option>
                            </select>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label for="scanLevel" class="form-label">Scan Level (1-5)</label>
                            <input type="number" class="form-control" id="scanLevel" min="1" max="5" value="3">
                        </div>
                        <div class="col-md-4">
                            <label for="riskLevel" class="form-label">Risk Level (1-3)</label>
                            <input type="number" class="form-control" id="riskLevel" min="1" max="3" value="2">
                        </div>
                        <div class="col-md-4">
                            <label for="threads" class="form-label">Threads</label>
                            <input type="number" class="form-control" id="threads" min="1" max="10" value="3">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Scan Techniques:</label>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="booleanBased" checked>
                            <label class="form-check-label" for="booleanBased">Boolean-based</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="timeBased" checked>
                            <label class="form-check-label" for="timeBased">Time-based</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="errorBased" checked>
                            <label class="form-check-label" for="errorBased">Error-based</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="unionBased" checked>
                            <label class="form-check-label" for="unionBased">UNION-based</label>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Advanced Options:</label>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="crawl">
                            <label class="form-check-label" for="crawl">Crawl website</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="dump">
                            <label class="form-check-label" for="dump">Dump database</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="osShell">
                            <label class="form-check-label" for="osShell">Attempt OS shell</label>
                        </div>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-danger" id="scanBtn">Start Scan</button>
                        <button type="button" class="btn btn-outline-secondary" id="stopBtn" disabled>Stop Scan</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card shadow mb-4">
            <div class="card-header bg-dark text-white">
                <h5 class="mb-0">Scan Progress</h5>
            </div>
            <div class="card-body">
                <div class="progress mb-3">
                    <div id="scanProgress" class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 0%"></div>
                </div>
                <div class="terminal" id="scanLog">
                    <div class="log-entry info">Ready to scan. Enter target URL and click Start Scan.</div>
                </div>
            </div>
        </div>

        <div class="card shadow" id="resultsCard" style="display: none;">
            <div class="card-header bg-dark text-white">
                <h5 class="mb-0">Scan Results</h5>
            </div>
            <div class="card-body">
                <div id="vulnerabilityResults"></div>
                <div id="databaseInfo" class="mt-4"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const scanForm = document.getElementById('scanForm');
            const scanBtn = document.getElementById('scanBtn');
            const stopBtn = document.getElementById('stopBtn');
            const scanLog = document.getElementById('scanLog');
            const scanProgress = document.getElementById('scanProgress');
            const resultsCard = document.getElementById('resultsCard');
            const vulnerabilityResults = document.getElementById('vulnerabilityResults');
            const databaseInfo = document.getElementById('databaseInfo');

            let scanActive = false;
            let progressInterval;
            let currentProgress = 0;

            // Add log entry to terminal
            function addLog(message, type = 'info') {
                const logEntry = document.createElement('div');
                logEntry.className = `log-entry ${type}`;
                logEntry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
                scanLog.appendChild(logEntry);
                scanLog.scrollTop = scanLog.scrollHeight;
            }

            // Update progress bar
            function updateProgress(percent) {
                currentProgress = percent;
                scanProgress.style.width = `${percent}%`;
                scanProgress.setAttribute('aria-valuenow', percent);
            }

            // Simulate scan progress
            function simulateProgress() {
                if (currentProgress < 100) {
                    currentProgress += Math.floor(Math.random() * 5) + 1;
                    if (currentProgress > 100) currentProgress = 100;
                    updateProgress(currentProgress);
                } else {
                    clearInterval(progressInterval);
                    completeScan();
                }
            }

            // Complete the scan
            function completeScan() {
                scanActive = false;
                scanBtn.disabled = false;
                stopBtn.disabled = true;
                scanProgress.classList.remove('progress-bar-animated');

                // Randomly determine if vulnerable (for demo)
                const isVulnerable = Math.random() > 0.3;

                if (isVulnerable) {
                    addLog('Scan completed - vulnerabilities found!', 'success');
                    updateProgress(100);
                    showVulnerabilityResults(true);
                } else {
                    addLog('Scan completed - no vulnerabilities found', 'info');
                    updateProgress(100);
                    showVulnerabilityResults(false);
                }
            }

            // Show vulnerability results
            function showVulnerabilityResults(isVulnerable) {
                resultsCard.style.display = 'block';
                
                if (isVulnerable) {
                    vulnerabilityResults.innerHTML = `
                        <div class="alert alert-danger">
                            <h4><i class="bi bi-exclamation-triangle-fill"></i> SQL Injection Vulnerability Found!</h4>
                            <p>The target appears to be vulnerable to SQL injection attacks.</p>
                        </div>
                        <div class="mb-3">
                            <h5>Vulnerable Parameter:</h5>
                            <p><code>id</code> (GET parameter)</p>
                        </div>
                        <div class="mb-3">
                            <h5>Successful Techniques:</h5>
                            <ul>
                                <li>Boolean-based blind</li>
                                <li>Time-based blind</li>
                                <li>UNION query</li>
                            </ul>
                        </div>
                    `;

                    // Show database info if dump option was checked
                    if (document.getElementById('dump').checked) {
                        databaseInfo.innerHTML = `
                            <h4><i class="bi bi-database"></i> Database Information</h4>
                            <div class="table-responsive">
                                <table class="table table-sm table-bordered">
                                    <thead>
                                        <tr>
                                            <th>Database</th>
                                            <th>Tables</th>
                                            <th>Users</th>
                                            <th>Version</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr>
                                            <td>webapp_db</td>
                                            <td>users, products, orders</td>
                                            <td>admin, guest</td>
                                            <td>MySQL 5.7.34</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                            <div class="mt-3">
                                <h5>Sample Data from users table:</h5>
                                <pre class="p-3 bg-light">+----+----------+-------------------+-------+
| id | username | email             | admin |
+----+----------+-------------------+-------+
| 1  | admin    | admin@example.com | 1     |
| 2  | user1    | user1@example.com | 0     |
| 3  | user2    | user2@example.com | 0     |
+----+----------+-------------------+-------+</pre>
                            </div>
                        `;
                    }
                } else {
                    vulnerabilityResults.innerHTML = `
                        <div class="alert alert-success">
                            <h4><i class="bi bi-check-circle-fill"></i> No Vulnerabilities Found</h4>
                            <p>The target does not appear to be vulnerable to SQL injection based on the tests performed.</p>
                        </div>
                        <div class="alert alert-info">
                            <p>Note: This is not a guarantee that the application is completely secure. 
                            Consider performing a full security audit.</p>
                        </div>
                    `;
                }
            }

            // Start the scan
            scanForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const targetUrl = document.getElementById('targetUrl').value;
                if (!targetUrl) {
                    addLog('Please enter a target URL', 'error');
                    return;
                }

                scanActive = true;
                scanBtn.disabled = true;
                stopBtn.disabled = false;
                resultsCard.style.display = 'none';
                vulnerabilityResults.innerHTML = '';
                databaseInfo.innerHTML = '';
                scanLog.innerHTML = '';
                scanProgress.classList.add('progress-bar-animated');
                updateProgress(0);

                addLog(`Starting scan of ${targetUrl}`, 'info');
                addLog('Testing connection to target...', 'info');
                
                setTimeout(() => {
                    addLog('Connection established', 'success');
                    addLog('Identifying injection points...', 'info');
                    
                    // Simulate different tests
                    setTimeout(() => {
                        addLog('Testing for boolean-based blind SQLi...', 'info');
                        setTimeout(() => addLog('Boolean-based blind test successful', 'success'), 1000);
                        
                        addLog('Testing for time-based blind SQLi...', 'info');
                        setTimeout(() => addLog('Time-based blind test successful', 'success'), 1500);
                        
                        addLog('Testing for UNION query SQLi...', 'info');
                        setTimeout(() => addLog('UNION query test successful', 'success'), 2000);
                        
                        addLog('Testing for error-based SQLi...', 'info');
                        setTimeout(() => addLog('Error-based test successful', 'success'), 2500);
                        
                        progressInterval = setInterval(simulateProgress, 500);
                    }, 1000);
                }, 1000);
            });

            // Stop the scan
            stopBtn.addEventListener('click', function() {
                if (scanActive) {
                    scanActive = false;
                    clearInterval(progressInterval);
                    scanBtn.disabled = false;
                    stopBtn.disabled = true;
                    scanProgress.classList.remove('progress-bar-animated');
                    addLog('Scan stopped by user', 'warning');
                }
            });

            // Demo of command line interface
            function showCommandLine() {
                addLog('sqlmap/1.7.11# python sqlmap.py -u "' + document.getElementById('targetUrl').value + '"', 'info');
                addLog('[+] starting at: ' + new Date().toLocaleString(), 'info');
                addLog('[INFO] testing connection to the target URL', 'info');
                addLog('[INFO] checking if the target is protected by some kind of WAF/IPS/IDS', 'info');
                addLog('[INFO] testing if the target URL is stable', 'info');
                addLog('[INFO] target URL is stable', 'success');
                addLog('[INFO] testing if GET parameter is dynamic', 'info');
                addLog('[INFO] confirming that GET parameter is dynamic', 'success');
                addLog('[INFO] GET parameter appears to be dynamic', 'success');
                addLog('[INFO] heuristic (basic) test shows that GET parameter might be injectable', 'warning');
                addLog('[INFO] testing for SQL injection on GET parameter', 'info');
                addLog('[INFO] testing "AND boolean-based blind - WHERE or HAVING clause"', 'info');
                addLog('[INFO] testing "MySQL >= 5.0 AND error-based - WHERE, HAVING, ORDER BY or GROUP BY clause"', 'info');
                addLog('[INFO] testing "PostgreSQL AND error-based - WHERE or HAVING clause"', 'info');
                addLog('[INFO] testing "Microsoft SQL Server/Sybase AND error-based - WHERE or HAVING clause"', 'info');
                addLog('[INFO] testing "Oracle AND error-based - WHERE or HAVING clause (XMLType)"', 'info');
                addLog('[INFO] testing "MySQL >= 5.0.12 AND time-based blind"', 'info');
                addLog('[INFO] GET parameter appears to be "MySQL >= 5.0.12 AND time-based blind" injectable', 'success');
            }

            // Show command line when target URL changes
            document.getElementById('targetUrl').addEventListener('change', function() {
                if (this.value) {
                    scanLog.innerHTML = '';
                    showCommandLine();
                }
            });
        });
    </script>
</body>
</html>
